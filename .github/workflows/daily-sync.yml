name: Daily football sync

on:
  schedule:
    # Every four hours: 09:00, 13:00, 17:00 and 21:00 UTC. GitHub can start scheduled
    # runs a few minutes late.
    - cron: "0 9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional fixture date override (YYYY-MM-DD, defaults to today in UTC)"
        required: false
        type: string

# Never let two syncs spend the same API-Football daily quota.
concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Collect fixtures, odds and AI analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync into Cloudflare KV
        run: node scripts/sync.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Optional: only needed when routing DeepSeek through Cloudflare AI Gateway.
          CF_GATEWAY_ID: ${{ secrets.CF_GATEWAY_ID }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          SYNC_DATE: ${{ inputs.date }}
