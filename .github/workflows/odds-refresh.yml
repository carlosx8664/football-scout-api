name: Odds refresh

on:
  # Dispatched by the Cloudflare Cron Worker (workers/dispatch-trigger).
  # The Cloudflare Cron fires every 15 minutes.
  workflow_dispatch:

# Slow runs must never overlap and double-write KV.
concurrency:
  group: odds-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Fetch odds, rebuild feeds, publish to KV
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DAYS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch odds from the 4 fast bookmakers
        run: node scripts/fetch-odds.js --days="$DAYS"

      - name: Fetch odds from BetPawa (Playwright)
        run: node scripts/fetch-betpawa.js

      - name: Fetch odds from Soccabet (Playwright)
        # New source: a failed capture keeps the previous snapshot and must not kill the run.
        continue-on-error: true
        run: node scripts/fetch-soccabet.js

      - name: Restore arb history from KV
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p data
          curl -sS --fail \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/feed-arbs-history" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -o data/arbs-history.json \
            && echo "Restored $(wc -c < data/arbs-history.json) bytes of arb history." \
            || echo "No previous arb history in KV; starting a fresh one."

      - name: Build arbitrage feed and send alerts
        run: node scripts/find-arbs.js --alert-min=1.5
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Web Push: the same arbs are pushed to every subscribed browser. Runs only when
          # all of these are set; see README ("Phone notifications") for the setup.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || vars.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Only a fallback: each subscription carries the origin it was created on.
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || secrets.SITE_ORIGIN }}

      - name: Build match feed
        run: node scripts/build-match-feed.js --no-ai --days="$DAYS"
        env:
          # Unused while --no-ai is passed, but keeps CI working if AI analysis is re-enabled.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Verify feeds were written
        run: |
          for file in "public/matches.json" "public/arbs.json"; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty; refusing to overwrite KV."
              exit 1
            fi
            echo "$file: $(wc -c < "$file") bytes"
          done

      - name: Compare against the live feed (circuit breaker)
        id: guard
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          live=$(curl -sS --fail \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/feed-matches" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" 2>/dev/null || true)

          counts=$(LIVE="$live" node -e '
            const fs = require("fs");
            const count = (raw) => {
              try { return (JSON.parse(raw).matches ?? []).length; } catch { return null; }
            };
            const before = count(process.env.LIVE ?? "");
            const after = count(fs.readFileSync("public/matches.json", "utf8"));
            console.log(before ?? "none", after ?? 0);
          ')

          set -- $counts
          before=$1
          after=$2
          echo "live feed: ${before} matches, this run: ${after} matches"

          if [ "$before" = "none" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          threshold=$(( before / 2 ))
          if [ "$after" -lt "$threshold" ]; then
            echo "::error::Only ${after} matches vs ${before} live. Likely blocked; keeping the old feed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish feeds to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SKIP_MATCHES: ${{ steps.guard.outputs.skip }}
        run: |
          upload() {
            local key="$1" file="$2"
            curl -sS --fail-with-body -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/${key}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@${file}"
            echo " -> wrote ${key}"
          }

          # The match-feed circuit breaker must not block the arb feed: arbs found this
          # run are still valid even when the fixture scrape came back thin.
          if [ "$SKIP_MATCHES" != "true" ]; then upload "feed-matches" "public/matches.json"; fi
          upload "feed-arbs" "public/arbs.json"
          upload "feed-arbs-history" "data/arbs-history.json"